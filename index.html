<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>empeo Checkout Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: wide two-column checkout (task column + sticky order summary); plan step is a 5-up card row.
   CI taken from empeo.com (15 Nov 2026): orange #F05B2F, gradient pill CTAs, 26px rounded cards, green savings pills.
   Single light theme on purpose, matching empeo.com. */
:root {
  --bg: #f6f6f8;
  --surface: #ffffff;
  --surface-2: #f6f6f8;
  --line: #ececf1;
  --line-strong: #d2d2da;
  --fg: #1c1c22;
  --muted: #525260;
  --muted-2: #6a6a7c;
  --accent: #f05b2f;
  --accent-hover: #d94a20;
  --accent-dark: #b5401a;
  --accent-ink: #ffffff;
  --accent-soft: #fef1ec;
  --cta: linear-gradient(90deg, #f08a3f 0%, #f0704b 50%, #f0485f 100%);
  --ink-dark: #232038;
  --pop: #f05b2f;
  --ok: #008f6b;
  --ok-fill: #00c291;
  --ok-soft: #e3f8f1;
  --info: #0071cc;
  --info-soft: #e8f4ff;
  --warn: #9a5a00;
  --warn-soft: #fff3dc;
  --err: #d42c3a;
  --err-soft: #fdecee;
  --sample: #6b4bc4;
  --sample-soft: #f1ecfc;
  --shadow: 0 2px 6px rgba(28,28,34,.04), 0 12px 32px rgba(28,28,34,.06);
  --shadow-pop: 0 12px 32px rgba(240,91,47,.14);
  --f-display: "Prompt", "Sarabun", system-ui, sans-serif;
  --f-body: "Prompt", "Sarabun", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 20px;
  --r-lg: 26px;
  --r-sm: 12px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 15px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.25; margin: 0; text-wrap: balance; color: var(--fg); }
h1 { font-size: 32px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.wrap { max-width: 1260px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Banner + header */
.proto-banner { background: var(--sample-soft); color: var(--fg); font-size: 13px; border-bottom: 1px solid var(--line); }
.proto-banner .wrap { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding-block: 8px; }
.proto-banner b { color: var(--sample); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand small { padding-left: 12px; border-left: 1px solid var(--line-strong); }
.wordmark { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-display); font-weight: 500; font-size: 26px; letter-spacing: -0.01em; color: var(--accent); line-height: 1; }
.brand small { color: var(--muted); font-size: 13px; }
.secure { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }

/* Stepper */
.stepper { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; flex-wrap: wrap; }
.stepper li button { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 6px 10px; border-radius: 999px; font-size: 14px; color: var(--muted); cursor: default; }
.stepper li button.done { color: var(--fg); cursor: pointer; }
.stepper li button.done:hover { background: var(--surface-2); }
.stepper li button[aria-current="step"] { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.stepper .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1.5px solid var(--line-strong); }
.stepper .done .dot { background: var(--ok-fill); border-color: var(--ok-fill); color: #fff; }
.stepper [aria-current="step"] .dot { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }

main { padding-block: 28px 80px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 20px; }
.page-head p { color: var(--muted); margin-top: 6px; max-width: 62ch; }

/* Chips / badges */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; letter-spacing: .02em; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.chip.sample { background: var(--sample-soft); color: var(--sample); border: 1px dashed var(--sample); }
.chip.pop { background: var(--pop); color: #fff; }
.chip.rec { background: var(--ink-dark); color: #fff; }
.chip.save { background: var(--ok-fill); color: #fff; }
.chip.ok { background: var(--ok-fill); color: #fff; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.muted { background: var(--surface-2); color: var(--muted); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; min-height: 44px; padding: 10px 20px; font-weight: 500; border: 1.5px solid transparent; cursor: pointer; transition: background .15s, border-color .15s; text-decoration: none; }
.btn.primary { background: var(--cta); color: var(--accent-ink); box-shadow: 0 6px 16px rgba(240,91,47,.22); }
.btn.primary:hover { filter: brightness(.95); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; filter: none; }
.btn.secondary { background: var(--surface); color: var(--accent); border-color: var(--accent); }
.btn.secondary:hover { background: var(--accent-soft); }
.btn.ghost { background: none; color: var(--accent); padding: 8px 14px; min-height: 40px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.block { width: 100%; }
.btn.lg { min-height: 52px; padding: 13px 22px; font-size: 16px; }
.link { background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head p { color: var(--muted); font-size: 14px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; align-items: start; }
.layout > * { min-width: 0; }
@media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }

/* Plan step */
.finder { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 24px; margin-bottom: 18px; }
@media (max-width: 900px) { .finder { grid-template-columns: 1fr; } }
.finder > * { min-width: 0; }
.finder-label { font-size: 14px; font-weight: 500; color: var(--fg); margin-bottom: 8px; display: block; }
.need-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.need { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-size: 14px; }
.need:hover { border-color: var(--accent); }
.need[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.seg button[aria-checked="true"] { background: var(--accent); color: #fff; font-weight: 500; }
.seg .save { font-size: 11.5px; color: #fff; background: var(--ok-fill); border-radius: 999px; padding: 1px 8px; font-weight: 500; }
.finder-hc { }
.helper { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 12px; }
.helper-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.helper-head .finder-label { margin: 0; }
.helper-collapsed { border-top: 1px solid var(--line); padding-top: 14px; }
.rec-result { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; min-height: 34px; font-size: 14px; }
.rec-result > span:nth-child(2) { flex: 1 1 260px; min-width: 0; }
.rec-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--ink-dark); color: #fff; display: grid; place-items: center; flex: none; }
.rec-actions { display: flex; gap: 14px; }
.finder-hc-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; }
.finder-hc-head .finder-label { margin: 0; }
/* Headcount slider (หลอด), modelled on empeo.com's pricing slider */
.hc-wrap { display: grid; gap: 4px; }
.hc-entry { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-top: 10px; }
.hc-entry .stepper-input { border-color: var(--accent); box-shadow: 0 2px 8px rgba(240,91,47,.12); }
.hc-entry .stepper-input.focused { box-shadow: 0 0 0 4px var(--accent-soft); }
.hc-entry .stepper-input input { width: 72px; font-size: 18px; font-weight: 700; color: var(--fg); cursor: text; }
.hc-entry .stepper-input input:hover { background: var(--accent-soft); }
.hc-entry .stepper-input button:disabled { color: var(--line-strong); cursor: not-allowed; background: var(--surface); }
.hc-entry-unit { font-weight: 500; }
.hc-hint { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--muted-2); }
.hc-tip button { display: inline-flex; align-items: center; gap: 4px; }
.hc-slider { padding: 58px 4px 0; }
.hc-rail { position: relative; }
.hc-tip { --shift: 0%; position: absolute; bottom: calc(100% + 12px); transform: translateX(calc(-50% - var(--shift))); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--accent); color: #fff; border-radius: var(--r-sm); padding: 4px 12px; z-index: 3; transition: left .12s ease-out, background .2s; box-shadow: 0 6px 14px rgba(240,91,47,.28); }
.hc-tip:hover, .hc-tip.editing { background: var(--accent-hover); }
.hc-tip::after { content: ""; position: absolute; left: calc(50% + var(--shift)); top: 100%; transform: translateX(-50%); border: 8px solid transparent; border-bottom: 0; border-top-color: inherit; border-top-color: var(--accent); }
.hc-tip:hover::after, .hc-tip.editing::after { border-top-color: var(--accent-hover); }
.hc-tip button { background: none; border: 0; color: #fff; padding: 0; cursor: text; font: inherit; font-weight: 700; font-size: 17px; border-bottom: 2px solid rgba(255,255,255,.85); line-height: 1.5; font-variant-numeric: tabular-nums; }
.hc-tip input { width: 4.4ch; border: 0; border-bottom: 2px solid #fff; background: transparent; color: #fff; font: inherit; font-weight: 700; font-size: 17px; text-align: center; padding: 0; outline: none; line-height: 1.5; }
.hc-unit { font-weight: 600; font-size: 14px; }
.hc-range { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 30px; margin: 0; background: transparent; cursor: pointer; }
.hc-range:focus { outline: none; }
.hc-range::-webkit-slider-runnable-track { height: 12px; border-radius: 999px; background: linear-gradient(90deg, #f36b42 0, #f7a07b var(--p), var(--line) var(--p), var(--line) 100%); }
.hc-range::-moz-range-track { height: 12px; border-radius: 999px; background: var(--line); }
.hc-range::-moz-range-progress { height: 12px; border-radius: 999px; background: linear-gradient(90deg, #f36b42, #f7a07b); }
.hc-range::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -9px; border-radius: 50%; background: #fff; border: 7px solid var(--accent); box-shadow: 0 4px 10px rgba(240,91,47,.35); transition: transform .15s; }
.hc-range::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 7px solid var(--accent); box-shadow: 0 4px 10px rgba(240,91,47,.35); }
.hc-range:active::-webkit-slider-thumb { transform: scale(1.12); }
.hc-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px var(--accent-soft), 0 4px 10px rgba(240,91,47,.35); }
.hc-ticks { position: relative; height: 26px; margin-top: 8px; }
.hc-ticks button { position: absolute; top: 0; transform: translateX(-50%); background: none; border: 0; padding: 2px 4px; font: inherit; font-size: 13px; color: var(--muted-2); cursor: pointer; font-variant-numeric: tabular-nums; }
.hc-ticks button.on { color: var(--fg); }
.hc-ticks button:hover { color: var(--accent); }
@media (max-width: 560px) { .hc-ticks button:nth-child(odd):not(:last-child) { display: none; } }
.headcount-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stepper-input { display: inline-flex; align-items: stretch; border: 1.5px solid var(--line-strong); border-radius: 999px; overflow: hidden; background: var(--surface); }
.stepper-input button { width: 42px; border: 0; background: var(--surface); color: var(--accent); cursor: pointer; font-size: 20px; line-height: 1; }
.stepper-input button:hover { background: var(--accent-soft); color: var(--accent); }
.stepper-input input { width: 64px; border: 0; border-inline: 1px solid var(--line); text-align: center; padding: 9px 4px; background: transparent; font-variant-numeric: tabular-nums; font-weight: 500; -moz-appearance: textfield; appearance: textfield; }
.stepper-input input:focus { outline: none; background: var(--accent-soft); }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
.band-note { font-size: 13px; color: var(--muted); }

.plans { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: stretch; }
@media (max-width: 1180px) { .plans { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .plans { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; padding: 10px 2px 14px; margin-inline: -2px; scrollbar-width: thin; } .plans > .plan { flex: 0 0 84%; scroll-snap-align: center; } .plan:hover { transform: none; } }
.plan { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 18px 18px; gap: 14px; transition: border-color .15s, box-shadow .15s; }
.plan { isolation: isolate; transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s; }
.plan::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .25s;
  background: radial-gradient(120% 55% at 50% 0%, rgba(247,160,123,.28) 0%, rgba(240,91,47,.08) 45%, transparent 75%); }
.plan:hover, .plan:focus-within { transform: translateY(-6px); border-color: transparent; box-shadow: inset 0 0 0 2px var(--accent), 0 18px 40px rgba(240,91,47,.22); }
.plan:hover::before, .plan:focus-within::before, .plan.popular::before { opacity: 1; }
.plan.popular { border-color: transparent; box-shadow: inset 0 0 0 2px var(--accent), var(--shadow-pop); }
.plan.recommended { border-color: transparent; box-shadow: inset 0 0 0 2px var(--ink-dark), var(--shadow); }
.plan.popular.recommended { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 4px var(--accent-soft), var(--shadow-pop); }
.plan .flags { display: flex; gap: 6px; min-height: 26px; flex-wrap: wrap; }
.plan .rec-ribbon { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; box-shadow: 0 4px 10px rgba(35,32,56,.25); }
.plan-name { font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.best { color: var(--muted); font-size: 13.5px; min-height: 86px; margin-top: 4px; }
.best-label { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.chip.suite { background: var(--ink-dark); color: #fff; }
.plan.flash { animation: flash 1.2s ease-out; }
@keyframes flash { 0%, 60% { box-shadow: inset 0 0 0 2px var(--ink-dark), 0 0 0 8px rgba(240,91,47,.25); } }
.plan .benefits { border-top: 1px solid var(--line); padding-top: 14px; }
.plan .cta { margin-top: 0 !important; }
.price-block { min-height: 92px; }
.compare-bar { display: flex; align-items: center; justify-content: center; gap: 8px 16px; flex-wrap: wrap; margin-top: 22px; text-align: center; }
.cmp-anchor { scroll-margin-top: 16px; }
.compare { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 22px 18px; box-shadow: var(--shadow); }
.cmp-toolbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 14px; }
.cmp-toolbar p { margin-top: 4px; max-width: 70ch; }
.cmp-controls { display: flex; gap: 14px; align-items: center; }
.cmp-controls .toggle { align-items: center; }
.cmp-controls .toggle .sw { margin-top: 0; }
.cmp-controls .toggle input:checked + .sw { background: var(--accent); }
.cmp-pick { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; margin-bottom: 10px; }
.cmp-pick select { border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 9px 14px; background: var(--surface); font-weight: 500; width: 100%; }
.cmp-table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 14px; }
.cmp-table col.c-feat { width: 26%; }
.cmp-table th, .cmp-table td { padding: 11px 10px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; }
.cmp-table tbody th { text-align: left; font-weight: 400; color: var(--fg); }
.cmp-table thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1.5px solid var(--line-strong); vertical-align: bottom; padding-top: 14px; }
.cmp-table thead th.c-feat { text-align: left; }
.cmp-name { display: block; font-family: var(--f-display); font-size: 17px; font-weight: 700; }
.cmp-price { display: block; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.cmp-price small { font-weight: 400; color: var(--muted); font-size: 12px; }
.cmp-table thead .chip { margin: 2px 0; }
.cmp-table td.pop { background: rgba(240,91,47,.035); }
.cmp-table thead th.pop { background: #fff8f5; }
.cmp-table td.rec { background: rgba(35,32,56,.04); }
.cmp-table thead th.rec { background: #f4f3f7; }
.cmp-table tbody tr:hover > * { background: var(--surface-2); }
.cmp-table tfoot td, .cmp-table tfoot th { border-bottom: 0; padding-top: 16px; }
.cmp-table tfoot .btn { padding-inline: 8px; }
.cmp-table td { transition: opacity .2s; }
.cmp-table td.same, .cmp-table td.base { opacity: .28; }
.cmp-table tbody tr:hover > td.same, .cmp-table tbody tr:hover > td.base { opacity: .7; }
.cv.yes.up { flex-direction: column; gap: 2px; }
.cv.up .tick { width: 26px; height: 26px; border-radius: 50%; background: var(--cta); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(240,91,47,.35); }
.cv.up .new-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.cv.txt.up { background: var(--cta); color: #fff; font-weight: 600; border-radius: 10px; padding: 4px 10px; box-shadow: 0 4px 10px rgba(240,91,47,.3); }
.cv.add.up { border: 1.5px solid var(--accent); color: var(--accent); font-weight: 600; background: var(--surface); }
.up-count { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.up-count.base { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.diff-note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px; font-size: 13.5px; }
.diff-swatch { flex: none; width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; background: var(--cta); }
.cv { display: inline-flex; align-items: center; justify-content: center; gap: 1px; }
.cv.yes { color: var(--accent); font-weight: 700; }
.cv.no { color: var(--line-strong); font-size: 18px; }
.cv.add { font-size: 12px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.cv.txt { font-size: 13px; line-height: 1.35; }
.grp th, .grp td { background: var(--surface-2); }
.grp th button { display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; color: var(--fg); cursor: pointer; text-align: left; }
.grp th button .chev { flex: none; transition: transform .15s; color: var(--accent); }
